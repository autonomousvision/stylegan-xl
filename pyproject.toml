[tool.poetry]
name = "sgxl"
version = "0.1.0"
description = "StyleGAN-XL: Scaling StyleGAN to Large Diverse Datasets"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "*", from = "."}]

[tool.poetry.dependencies]
python = ">=3.8,<3.12"
numpy = ">=1.20"
click = ">=8.0"
pillow = ">=8.3.1"
scipy = ">=1.7.1"
torch = ">=1.9.1"
requests = ">=2.26.0"
tqdm = ">=4.62.2"
ninja = ">=1.10.2"
matplotlib = ">=3.4.2"
imageio = ">=2.9.0"
dill = ">=0.3.4"
psutil = ">=5.8.0"
regex = ">=2022.3.15"
imgui = ">=1.3.0"
glfw = ">=2.2.0"
pyopengl = ">=3.1.5"
imageio-ffmpeg = ">=0.4.3"
pyspng = "*"
ftfy = ">=6.1.1"
timm = ">=0.4.12"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"

[tool.poetry.scripts]
test = "pytest:main"
tests = "pytest:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=.",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=0",  # Set to 0 for validation, change to 80 for real tests
    "-vv",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "setup.py",
    "*/migrations/*",
    "*/.venv/*",
    "*/venv/*",
    "*/env/*",
    "*/virtualenv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"